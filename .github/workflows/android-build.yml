name: Android Build and Release

# Official APK build and GitHub Release are intentionally manual; ordinary merges must not publish an APK.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  unit-test:
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify source commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "Testing commit: $GITHUB_SHA"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Run unit tests before release
        run: gradle :app:testDebugUnitTest --stacktrace

  build:
    needs: unit-test
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify source commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "Building commit: $GITHUB_SHA"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Prepare official signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "${KEYSTORE_BASE64}"
          test -n "${KEYSTORE_PASSWORD}"
          test -n "${KEY_ALIAS}"

          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "$RUNNER_TEMP/a-bridgefs-release.jks"
          test -s "$RUNNER_TEMP/a-bridgefs-release.jks"

          echo "A_BRIDGEFS_KEYSTORE_FILE=$RUNNER_TEMP/a-bridgefs-release.jks" >> "$GITHUB_ENV"
          echo "A_BRIDGEFS_KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD}" >> "$GITHUB_ENV"
          echo "A_BRIDGEFS_KEY_ALIAS=${KEY_ALIAS}" >> "$GITHUB_ENV"
          echo "A_BRIDGEFS_KEY_PASSWORD=${KEYSTORE_PASSWORD}" >> "$GITHUB_ENV"

          keytool -list \
            -keystore "$RUNNER_TEMP/a-bridgefs-release.jks" \
            -storepass "${KEYSTORE_PASSWORD}" \
            -alias "${KEY_ALIAS}" \
            > /tmp/bridgefs-keytool.txt

          test -s /tmp/bridgefs-keytool.txt
          echo "Official signing keystore loaded successfully."

      - name: Build official release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify APK signature and signer identity
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          KEYSTORE="$RUNNER_TEMP/a-bridgefs-release.jks"
          test -s "$APK"
          test -s "$KEYSTORE"

          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose "$APK"

          expected_cert="$(keytool -exportcert -rfc \
            -keystore "$KEYSTORE" \
            -storepass "$A_BRIDGEFS_KEYSTORE_PASSWORD" \
            -alias "$A_BRIDGEFS_KEY_ALIAS" \
            | openssl x509 -noout -fingerprint -sha256 \
            | sed 's/^[^=]*=//' \
            | tr -d ':')"

          actual_cert="$("$APKSIGNER" verify --print-certs "$APK" \
            | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2; exit}' \
            | tr -d ':')"

          test -n "$expected_cert"
          test -n "$actual_cert"

          echo "Official keystore certificate SHA-256: $expected_cert"
          echo "APK signer certificate SHA-256:        $actual_cert"

          test "${expected_cert^^}" = "${actual_cert^^}"

          echo "APK signature verification and official signer identity check passed."

      - name: Prepare canonical APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          mkdir -p release
          cp "$APK" release/APS.apk
          test -s release/APS.apk

      - name: Upload canonical APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: APS-${{ github.sha }}
          path: release/APS.apk
          if-no-files-found: error

      - name: Publish latest Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest \
            release/APS.apk \
            --target "$GITHUB_SHA" \
            --title "APS latest" \
            --notes "Automatically published from commit $GITHUB_SHA."
